name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build engine and test runners
        run: make

      - name: Run perft, rules and search suites
        run: make test

      - name: UCI regression probes
        run: python tests/regression.py ./build/chess-engine

      - name: UCI smoke test
        run: |
          printf 'uci\nisready\nposition startpos\ngo wtime 1000 btime 1000\nquit\n' \
            | ./build/chess-engine > uci.out
          cat uci.out
          grep -q '^uciok$' uci.out
          grep -q '^readyok$' uci.out
          grep -Eq '^bestmove [a-h][1-8][a-h][1-8][qrbn]?$' uci.out

      - name: Play mode smoke test
        run: |
          printf 'e4\nquit\n' | ./build/chess-engine play > play.out
          cat play.out
          grep -q 'You played e4' play.out
          grep -q 'Engine plays' play.out

      - name: Self-play legality test
        run: |
          python -m pip install --quiet python-chess
          python tests/selfplay.py ./build/chess-engine 1 20
